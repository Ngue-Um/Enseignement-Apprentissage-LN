<!-- Tailwind CSS (same as main site) -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- Cytoscape.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>

<style>
  :root {
    --hist:   #7c3aed; --hist-bg:   #ede9fe;
    --ling:   #1d4ed8; --ling-bg:   #dbeafe;
    --geo:    #059669; --geo-bg:    #d1fae5;
    --social: #d97706; --social-bg: #fef3c7;
    --cogn:   #be185d; --cogn-bg:   #fce7f3;
  }

  /* ── Family colour palette for node backgrounds ── */
  .fc-bantoid   { background: #818cf8 !important; }
  .fc-bantu     { background: #22d3ee !important; }
  .fc-ubangian  { background: #f97316 !important; }
  .fc-adamawa   { background: #84cc16 !important; }
  .fc-chadic    { background: #facc15 !important; }
  .fc-nilosaharan{ background: #e879f9 !important; }
  .fc-atlantic  { background: #fb7185 !important; }
  .fc-other     { background: #94a3b8 !important; }

  #cy { width: 100%; height: 100%; }

  .plane-btn { transition: all .15s; }
  .plane-btn.active { box-shadow: inset 0 0 0 2px currentColor; }

  #detail-panel {
    transition: transform .25s ease;
    transform: translateX(110%);
  }
  #detail-panel.open {
    transform: translateX(0);
  }

  /* slim scrollbar */
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: #f1f5f9; }
  ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 4px; }

  .tag {
    display: inline-block; border-radius: 4px;
    font-size: 11px; font-weight: 600;
    padding: 1px 7px; margin: 2px 2px;
  }

  /* ── Responsive / mobile ─────────────────────────────────────────────── */
  body { height: 100vh; height: 100dvh; }
  #cy { touch-action: none; }
  #sidebar-backdrop { display: none; }
  .map-ctrl {
    width: 40px; height: 40px; display: grid; place-items: center;
    background: #fff; border: 1px solid #e2e8f0; border-radius: 10px;
    box-shadow: 0 1px 3px rgba(0,0,0,.08); font-size: 18px; font-weight: 700; color: #475569;
  }
  .map-ctrl:active { background: #f1f5f9; }

  @media (max-width: 767px) {
    /* Sidebar becomes an off-canvas drawer */
    #sidebar {
      position: fixed; top: 0; left: 0; bottom: 0;
      width: 85vw; max-width: 320px; z-index: 40;
      transform: translateX(-105%);
      transition: transform .25s ease;
      box-shadow: 0 10px 40px rgba(15,23,42,.25);
    }
    #sidebar.open { transform: translateX(0); }
    #sidebar { overflow-y: auto !important; -webkit-overflow-scrolling: touch; }
    #sidebar > #community-wrap { flex: none; overflow: visible; }
    #sidebar > #legend-wrap { max-height: none; overflow: visible; }
    #sidebar-backdrop.open {
      display: block; position: fixed; inset: 0;
      background: rgba(15,23,42,.45); z-index: 35;
    }
    /* Detail panel becomes a bottom sheet */
    #detail-panel {
      top: auto; bottom: 0; left: 0; right: 0;
      width: 100%; height: auto;
      max-height: 55vh; max-height: 55dvh;
      border-left: 0; border-top: 1px solid #e2e8f0;
      border-radius: 18px 18px 0 0;
      transform: translateY(105%);
      padding-bottom: env(safe-area-inset-bottom);
    }
    #detail-panel.open { transform: translateY(0); }
    /* Bigger touch targets */
    .plane-btn.tag { font-size: 12.5px; padding: 6px 10px; }
    .layout-btn { padding: 8px 12px !important; font-size: 13px !important; }
    #community-list > div { padding-top: 10px; padding-bottom: 10px; }
    #search { font-size: 16px; } /* prevents iOS zoom on focus */
    #weight-slider { height: 28px; }
  }
</style>
</head>
<body class="bg-slate-50 text-slate-800 overflow-hidden" style="height:100vh; display:flex; flex-direction:column;">

<!-- ══ MAIN LAYOUT ══════════════════════════════════════════════════════════ -->
<div class="flex flex-1 overflow-hidden relative">

  <!-- ── LEFT SIDEBAR ──────────────────────────────────────────────────────── -->
  <div id="sidebar-backdrop"></div>
  <aside id="sidebar" class="w-64 bg-white border-r border-slate-200 flex flex-col overflow-hidden flex-shrink-0" aria-label="Filtres et liste des communautés">

    <!-- Mobile drawer header -->
    <div class="md:hidden flex items-center justify-between px-3 py-2 border-b border-slate-100">
      <span class="font-bold text-slate-700">CamRhizome · Filtres</span>
      <button id="btn-sidebar-close" type="button" class="text-slate-400 hover:text-slate-700 text-2xl leading-none px-2" aria-label="Fermer">✕</button>
    </div>

    <!-- Search -->
    <div class="p-3 border-b border-slate-100">
      <input id="search" type="text" placeholder="Chercher une communauté…"
        class="w-full text-sm border border-slate-200 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-400"/>
    </div>

    <!-- Plane filters -->
    <div class="p-3 border-b border-slate-100">
      <div class="text-xs font-bold uppercase tracking-wide text-slate-400 mb-2">Plans d'analyse</div>
      <div class="flex flex-wrap gap-1">
        <button data-plane="hist"   class="plane-btn active tag" style="background:var(--hist-bg);color:var(--hist)">Historique</button>
        <button data-plane="ling"   class="plane-btn active tag" style="background:var(--ling-bg);color:var(--ling)">Linguistique</button>
        <button data-plane="geo"    class="plane-btn active tag" style="background:var(--geo-bg);color:var(--geo)">Géographique</button>
        <button data-plane="social" class="plane-btn active tag" style="background:var(--social-bg);color:var(--social)">Social</button>
        <button data-plane="cogn"   class="plane-btn active tag" style="background:var(--cogn-bg);color:var(--cogn)">Cognitif</button>
      </div>
    </div>

    <!-- Weight threshold -->
    <div class="p-3 border-b border-slate-100">
      <div class="flex justify-between text-xs text-slate-500 mb-1">
        <span class="font-bold uppercase tracking-wide text-slate-400">Poids min.</span>
        <span id="weight-val" class="font-semibold text-indigo-600">0.10</span>
      </div>
      <input id="weight-slider" type="range" min="0" max="90" value="10" step="5"
        class="w-full accent-indigo-600"/>
    </div>

    <!-- Layout selector -->
    <div class="p-3 border-b border-slate-100">
      <div class="text-xs font-bold uppercase tracking-wide text-slate-400 mb-2">Disposition</div>
      <div class="flex gap-1">
        <button data-layout="cose"   class="layout-btn active text-xs px-2 py-1 rounded bg-indigo-100 text-indigo-700 font-semibold">Force</button>
        <button data-layout="circle" class="layout-btn text-xs px-2 py-1 rounded bg-slate-100 text-slate-600 font-semibold">Cercle</button>
        <button data-layout="grid"   class="layout-btn text-xs px-2 py-1 rounded bg-slate-100 text-slate-600 font-semibold">Grille</button>
      </div>
    </div>

    <!-- Community list -->
    <div id="community-wrap" class="flex-1 overflow-y-auto">
      <div class="text-xs font-bold uppercase tracking-wide text-slate-400 px-3 pt-3 pb-1">
        Communautés <span id="node-count" class="text-indigo-500"></span>
      </div>
      <div id="community-list" class="pb-2"></div>
    </div>

    <!-- Legend -->
    <div id="legend-wrap" class="p-3 border-t border-slate-100 bg-slate-50 max-h-[30%] overflow-y-auto">
      <div class="text-xs font-bold uppercase tracking-wide text-slate-400 mb-2">Familles linguistiques</div>
      <div id="legend" class="space-y-1"></div>
    </div>
  </aside>

  <!-- ── GRAPH CANVAS ───────────────────────────────────────────────────────── -->
  <div class="flex-1 relative overflow-hidden">
    <div id="cy" class="w-full h-full"></div>

    <!-- Loading overlay -->
    <div id="loading" class="absolute inset-0 flex items-center justify-center bg-slate-50">
      <div class="text-center">
        <div class="w-12 h-12 border-4 border-indigo-200 border-t-indigo-600 rounded-full animate-spin mx-auto mb-3"></div>
        <div class="text-slate-500 text-sm">Tissage du rhizome…</div>
      </div>
    </div>

    <!-- Top-right stats bar -->
    <div id="stats-bar" class="hidden absolute top-2 right-2 sm:top-3 sm:right-3 bg-white/90 backdrop-blur rounded-xl shadow text-[11px] sm:text-xs px-3 py-1.5 sm:px-4 sm:py-2 text-slate-600 space-x-3 sm:space-x-4">
      <span>Nœuds : <strong id="stat-nodes" class="text-indigo-600"></strong></span>
      <span><span class="hidden sm:inline">Arêtes visibles</span><span class="sm:hidden">Liens</span> : <strong id="stat-edges" class="text-indigo-600"></strong></span>
    </div>

    <!-- Touch hint (mobile only, fades out) -->
    <div id="touch-hint" class="md:hidden hidden absolute bottom-4 left-3 bg-indigo-600 text-white text-[11px] rounded-lg px-3 py-1.5 shadow transition-opacity duration-700">
      Pincez pour zoomer · touchez un nœud
    </div>

    <!-- Reset / fit button -->
    <div id="map-controls" class="hidden absolute bottom-4 right-3 sm:right-4 flex flex-col items-end gap-2" style="margin-bottom:env(safe-area-inset-bottom)">
      <button id="btn-zoom-in"  type="button" class="map-ctrl" aria-label="Zoomer">+</button>
      <button id="btn-zoom-out" type="button" class="map-ctrl" aria-label="Dézoomer">−</button>
      <button id="btn-fit" type="button" class="bg-white shadow rounded-lg px-3 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-50 border border-slate-200" aria-label="Ajuster la vue">
        ⊞ <span class="hidden sm:inline">Ajuster la vue</span>
      </button>
    </div>
  </div>

  <!-- ── DETAIL PANEL (slides in from right) ───────────────────────────────── -->
  <div id="detail-panel"
    class="absolute top-0 right-0 h-full w-80 max-w-full bg-white border-l border-slate-200 shadow-2xl overflow-y-auto z-20 flex flex-col">
    <div class="md:hidden flex justify-center pt-2"><span class="w-10 h-1.5 rounded-full bg-slate-200"></span></div>
    <div class="flex items-start justify-between p-4 border-b border-slate-100 sticky top-0 bg-white z-10">
      <div>
        <div id="dp-title" class="font-black text-lg text-indigo-700"></div>
        <div id="dp-emic"  class="text-xs text-slate-400 mt-0.5"></div>
      </div>
      <button id="dp-close" type="button" class="text-slate-400 hover:text-slate-600 text-2xl leading-none -mt-1 px-2" aria-label="Fermer">✕</button>
    </div>
    <div id="dp-body" class="p-4 space-y-4 flex-1 text-sm"></div>
  </div>

</div>

<script>const RHIZOME_DATA={"metadata":{"generated":"2026-08-27","project":"CamRhizome — Réseau inter-communautaire du Cameroun","version":"1.1","nodeCount":51,"edgeCount":979,"note":"Réseau de 51 communautés : relations historiques, linguistiques, géographiques, sociales et cognitives."},"nodes":[{"id":"BAFO","slug":"BAFOU","label":"Bafou","emicName":"afhō","meaning":"« ceux qui fouillent jusqu'au fond », qui vont en profondeur","region":"Ouest","family":"Bantoïde (Grassfields)","fc":"bantoid","numeralSystem":"vigésimal","origins":[],"recordId":"BAFO_2020_001","overview":"Peuple majoritaire et largement autochtone de la Menoua, voisin de Baleveng, Bafoussam et Mbouda, les Bafou parlent le yemba. La chefferie s'appuie sur les collèges des « 9 » et des « 7 » notables, des sociétés rituelles et un riche culte des crânes ; agriculture, élevage et commerce font vivre la communauté, qui célèbre tous les deux ans son festival Lemou."},{"id":"BAKA","slug":"BAKA","label":"Baka","emicName":"Baka","meaning":"« liberté » : un peuple de grande mobilité","region":"Est / Sud","family":"Oubanguien","fc":"ubangian","numeralSystem":"quinaire / vigésimal","origins":[],"recordId":"BAKA_2020_001","overview":"Peuple forestier minoritaire, mobile et égalitaire, les Baka vivent aux côtés des Nzimé et des Mpoupieng, de Yokadouma à Lomié et jusqu'à Bipindi. Chasse, cueillette, pêche et petite agriculture font vivre une communauté où la terre est un bien commun et où les initiés du jengi assurent justice et protection."},{"id":"BKKO","slug":"BAKOKO","label":"Bakoko (Adie)","emicName":"Adie","meaning":"du nom de l'ancêtre fondateur Adie ; lié au nom d'Édéa","region":"Littoral","family":"Bantou","fc":"bantu","numeralSystem":"vigésimal","origins":["Égypte"],"recordId":"BKKO_2020_001","overview":"Les Adie (Bakoko) vivent autour d'Édéa, mêlés aux Basaa, aux Bati-Mpoo et à des populations venues d'ailleurs. Organisés en deux grandes familles, les Benanes et les Dogtomèn, ils associent pêche, chasse et agriculture au bord de la Sanaga, et célèbrent chaque année la fête du Mpoo en décembre."},{"id":"BANN","slug":"BANEN","label":"Banen (Ndogtuna)","emicName":"Banen Ndogtuna","meaning":"« peuple travailleur et laboureur »","region":"Littoral","family":"Bantou","fc":"bantu","numeralSystem":"vigésimal","origins":["Cameroun"],"recordId":"BANN_2020_001","overview":"Venus de Ndiki (Mbam) par l'Ouest et Makombé, les Banen Ndogtuna ont trouvé à Yabassi une terre d'accueil où ils côtoient Bandem, Basaa, Bamiléké, Haoussa, Bamoun, Beti, Bodiman et Dibum. Organisés en chefferies héréditaires, ils vivent d'agriculture, de pêche et de chasse, et fêtent le Ngankam chaque année en avril."},{"id":"BOUM","slug":"BOUM","label":"Mboum (Ngaoundéré)","emicName":"Mboum","meaning":"Ngaoundéré renvoie à la montagne « au nombril », qui a donné son nom à la ville","region":"Adamaoua","family":"Adamaoua","fc":"adamawa","numeralSystem":"décimal","origins":["Soudan","Égypte","Yémen"],"recordId":"BOUM_2020_001","overview":"Les Mboum, fondateurs historiques de Ngaoundéré, y sont aujourd'hui minoritaires parmi les Peuls, Gbaya, Haoussa, Kanuri et migrants du Sud. Très islamisés, patrilinéaires et organisés autour de la chefferie et des corps de métiers, ils pratiquent l'agriculture, l'élevage et un artisanat ancien, au rythme du tam-tam et du balafon."},{"id":"FULA","slug":"FOUFOULDE","label":"Peuls Walarbe (Gashiga)","emicName":"Foulbé / Pular","meaning":"","region":"Nord / Adamaoua","family":"Atlantique (peul)","fc":"atlantic","numeralSystem":"vigésimal","origins":["Mali","Cameroun"],"recordId":"FULA_2020_001","overview":"Les Peuls Walarbe de Gashiga, majoritaires dans leur zone, vivent aux côtés des Fali et des Bata. Venus du Mali, du Burkina Faso et du Niger par Bashéo, Demsa et les monts Mandara, ils forment un lamidat héréditaire où l'islam règle la vie sociale ; élevage, agriculture, commerce et enseignement coranique en sont les piliers."},{"id":"GBYA","slug":"GBAYA","label":"Gbaya","emicName":"Gbaya","meaning":"« la grosse fourmi »","region":"Est","family":"Oubanguien","fc":"ubangian","numeralSystem":"quinaire / vigésimal","origins":["Soudan","Égypte"],"recordId":"GBYA_2020_001","overview":"Peuple de tradition guerrière et de chasseurs, présent dans plusieurs régions du Cameroun et jusqu'en Centrafrique, au Soudan et au Nigeria, les Gbaya vivent ici aux côtés des Makaa du Nord, des Bobilis, des Kpere, des Kako et des Bamvələ. L'initiation au labi structurait autrefois la vie sociale ; aujourd'hui largement christianisés, ils restent attachés aux remèdes traditionnels et à la bière de maïs."},{"id":"GUIZ","slug":"GUIZIGA","label":"Guiziga Muturwa","emicName":"Guiziga Muturwa","meaning":"","region":"Extrême-Nord","family":"Tchadique","fc":"chadic","numeralSystem":"vigésimal","origins":["Soudan","Cameroun"],"recordId":"GUIZ_2020_001","overview":"Venus du Soudan par Gudur et Mokong, les Guiziga de Muturwa vivent parmi les Gudur et les Guidar, dans un paysage de montagnes sacrées comme le « Doigt de Dieu ». Patrilinéaires, organisés autrefois sous l'autorité du lulo en classes de forgerons et de cultivateurs, ils honorent leurs ancêtres par le mulvring et célèbrent les grandes fêtes de Diguila et Muvulgum."},{"id":"KTKK","slug":"KOTOKO","label":"Kotoko (Kousseri)","emicName":"Mantagé","meaning":"","region":"Extrême-Nord","family":"Tchadique","fc":"chadic","numeralSystem":"vigésimal","origins":["Soudan","Tchad"],"recordId":"KTKK_2020_001","overview":"Fondateurs de Kousseri et gardiens de ses traditions, les Kotoko (Mantagé) se disent descendants des Sao, venus de l'Égypte ancienne par le Soudan et le Tchad. Sous l'autorité d'un sultan entouré de notables, ce peuple de pêcheurs du Logone honore les génies des eaux, construit des pirogues et danse au son des tam-tams du sultan."},{"id":"LIMB","slug":"LIMBUM","label":"Wimbum (Limbum)","emicName":"Wimbum","meaning":"« le peuple mbum »","region":"Nord-Ouest","family":"Bantoïde (Grassfields)","fc":"bantoid","numeralSystem":"vigésimal","origins":[],"recordId":"LIMB_2020_001","overview":"Majoritaires sur le plateau de Nkambe, les Wimbum y sont arrivés depuis la région tikar, en quête de terres fertiles et pour échapper aux razzias peules. Royauté sacrée du fon, puissantes sociétés secrètes, tissage, vin de palme et bière de maïs caractérisent une culture proche de celles du Nord-Ouest et de l'Ouest."},{"id":"MND1","slug":"MANDARA1","label":"Kanuri (Kolofata)","emicName":"Kanuri","meaning":"« ceux de la noblesse »","region":"Extrême-Nord","family":"Nilo-saharien","fc":"nilosaharan","numeralSystem":"vigésimal","origins":["Yémen"],"recordId":"MND1_2020_001","overview":"Majoritaires à Kolofata, les Kanuri y vivent avec les Mandara, Podoko, Mouktélé, Gamergou, Arabes choa et Peuls. Venus du Yémen par Kouka et Maiduguri, ces héritiers du Bornou organisent leur vie autour de la royauté, de l'islam et de castes de métiers (forgerons, bouchers, tisserands, tailleurs) ; agriculture, petit élevage et commerce les font vivre."},{"id":"MND2","slug":"MANDARA_2","label":"Mandara (Wandala)","emicName":"Wandala","meaning":"« les bâtisseurs »","region":"Extrême-Nord","family":"Tchadique","fc":"chadic","numeralSystem":"vigésimal","origins":[],"recordId":"MND2_2020_001","overview":"Majoritaires et autochtones autour de Mora, les Wandala ont fondé un sultanat ancien, ouvert aux Kanuri, Podoko, Mouktélé, Arabes choa, Malgwa et Kotoko. Islamisés, organisés en royauté, castes et classes d'âge, ils vivent d'agriculture, d'élevage, de commerce et d'artisanat, et partagent avec les Kanuri un long itinéraire migratoire."},{"id":"MNDG","slug":"MOUNDANG","label":"Moundang (Kaélé)","emicName":"Moundang","meaning":"","region":"Nord","family":"Adamaoua","fc":"adamawa","numeralSystem":"décimal","origins":["Soudan","Tchad","Cameroun"],"recordId":"MNDG_2020_001","overview":"Majoritaires autour de Kaélé (« près de l'eau »), les Moundang côtoient Guiziga, Peuls et Toupouri. Venus du Soudan par Léré, au Tchad, avec lequel ils partagent fêtes, initiation et royauté, ils obéissent à un souverain, le gon, entouré de onze notables. Le guinarou, grande initiation masculine, et la fête bisannuelle de Gbeza rythment leur vie."},{"id":"MPNG","slug":"MPOUPIENG","label":"Mpoupieng","emicName":"Mpoupieng","meaning":"« fortification des gens »","region":"Littoral","family":"Bantou","fc":"bantu","numeralSystem":"vigésimal","origins":[],"recordId":"MPNG_2020_001","overview":"Petit groupe forestier de l'Est, les Mpoupieng vivent mêlés aux Baka, aux Maka et aux Djem, dont ils parlent souvent la langue. Leur société, peu hiérarchisée, accorde le prestige au chef de famille prospère ; l'agriculture de rente et vivrière, le vin de palme et le balafon marquent leur vie."},{"id":"NGMB","slug":"NGOMBALE","label":"Babadjou (Mbasso)","emicName":"Mbasso","meaning":"« les fins guerriers »","region":"Ouest","family":"Bantou","fc":"bantu","numeralSystem":"vigésimal","origins":[],"recordId":"NGMB_2020_001","overview":"Peuple majoritaire des Bamboutos, les Babadjou (Mbasso) parlent le ngomba'e, une langue propre au groupement. Venus pour la plupart de Bapa (Nord-Ouest), ils s'organisent autour du chef supérieur, des collèges des 9 et des 7 notables et de serviteurs rituels ; café, élevage et cultures vivrières les font vivre, et le festival Lehere clôt chaque année."},{"id":"NVNV","slug":"NVON_NVON","label":"Mvón-Mvón","emicName":"Mvoń-Mvón","meaning":"","region":"Est","family":"Adamaoua","fc":"adamawa","numeralSystem":"vigésimal","origins":[],"recordId":"NVNV_2020_001","overview":"Les Mvón-Mvón disent avoir toujours vécu à Yokadouma, où ils cohabitent avec les Mbimo, Bayege, Gbaya et Kako. Organisés autour de la parenté et d'un pouvoir héréditaire exercé par consensus, ils vivent d'agriculture, de chasse, de pêche et de cueillette ; le labi et le patenge rythment leurs cérémonies."},{"id":"OROK","slug":"OROK","label":"Oroko (Ŋgóló)","emicName":"Ŋgóló","meaning":"« le rassemblement »","region":"Sud-Ouest","family":"Bantou","fc":"bantu","numeralSystem":"quinaire / vigésimal","origins":[],"recordId":"OROK_2020_001","overview":"Les Ŋgóló, l'un des clans du peuple Oroko, vivent en bonne entente avec leurs voisins et avec les migrants des Grassfields qu'ils appellent báŋgárà. Venus d'Ísàkà (Bakassi) par Màtùbà, ils ont une chefferie peu centralisée et une maison sacrée, l'étánà, qui conserve la culture du village ; café, cultures vivrières, chasse et élevage les font vivre."},{"id":"PODO","slug":"PODOKO","label":"Podoko (Parkwa)","emicName":"Parkwa / Arba","meaning":"","region":"Extrême-Nord","family":"Tchadique","fc":"chadic","numeralSystem":"vigésimal","origins":[],"recordId":"PODO_2020_001","overview":"Peuple de montagne des monts Mandara, longtemps replié sur lui-même, les Podoko (Parkwa) se disent venus de Gaza par Waza et le Logone. Les montagnes, leur berceau et leur refuge, abritent leurs lieux sacrés ; agriculture du mil et du haricot, petit élevage et forge les font vivre, et les fêtes de Dilda et des récoltes ponctuent l'année."},{"id":"SHPM","slug":"SHU_PAMOM","label":"Bamoun (Pamom)","emicName":"Pamɔm","meaning":"« l'homme rusé, à la vision lointaine »","region":"Ouest","family":"Bantoïde (Grassfields)","fc":"bantoid","numeralSystem":"inconnu","origins":[],"recordId":"SHPM_2020_001","overview":"Fondé en 1394 par Nchare Yen, un prince tikar venu de Rifoum (Mbankim), le royaume bamoun est dirigé par un mfon entouré de notables, de serviteurs et de la famille royale. Le shüpamom, langue des Mbèn soumis par le fondateur, est devenu la langue du royaume. Artisanat d'art, culte des morts et grande fête du Nguon font la renommée de Foumban."},{"id":"YEMB","slug":"YEMBA","label":"Bandjoun (Djo)","emicName":"Djo","meaning":"« ceux qui achètent », ceux qui ont de l'argent","region":"Ouest","family":"Bantoïde (Grassfields)","fc":"bantoid","numeralSystem":"vigésimal","origins":[],"recordId":"YEMB_2020_001","overview":"Les Djo de Bandjoun forment une grande chefferie de l'Ouest, issue de peuples venus de Ŋwa (Haut-Nkam), de Baleng et du pays bamoun. Royauté, confréries et culte des crânes structurent la société ; café, commerce et artisanat (forge, vannerie, sculpture) la font vivre, et le festival Msəm Tódjom réunit la communauté les années impaires."},{"id":"BAFI","slug":"BAFIA","label":"Bafia (Rigama)","emicName":"Beu pak","meaning":"","region":"Centre","family":"Bantou","fc":"bantu","numeralSystem":"inconnu","origins":["Cameroun"],"recordId":"BAFI_2020_001","overview":"Majoritaires dans leur canton, les Bafia de Rigama cohabitent avec Bamiléké, Tikar, Haoussa et Yambassa dans un esprit de vivre-ensemble. Issus de Bakoa (Bokito), ils descendent de Meden à Ngam, « fils de Ngam ». Agriculteurs, vanniers et sculpteurs, ils dansent le dom aux funérailles des anciens et exposent leur art au festival Mbam Art."},{"id":"BLGU","slug":"BALENGOU","label":"Balengou","emicName":"Balengou","meaning":"","region":"Ouest","family":"Bantoïde (Grassfields)","fc":"bantoid","numeralSystem":"inconnu","origins":["Cameroun"],"recordId":"BLGU_2020_001","overview":"Majoritaires dans leur zone du Ndé, les Balengou sont liés aux Baleng, dont ils partagent les rites politiques, et vivent en contact avec Bamena, Baïok, Bangwa, Bafang et Mbouda. La chefferie, les notables et les classes sociales (famille royale, forgerons, artisans) structurent une société où l'on honore les ancêtres et où la fête du mbouob rassemble la communauté."},{"id":"BMVL","slug":"BAMVELE","label":"Bamvələ","emicName":"Bamvələ / Osak Bassam","meaning":"","region":"Centre","family":"Bantou","fc":"bantu","numeralSystem":"inconnu","origins":[],"recordId":"BMVL_2020_001","overview":"Les Bamvələ vivent sur leur terre ancestrale, majoritaires au milieu des Gbaya, des Makaa et de nouveaux venus. Société ouverte où le chef décide en assemblée avec ses notables, ils pratiquent l'agriculture, la pêche et un peu de commerce, partagent avec les Beti la danse et le mvet, et font du mbɔ̀l leur plat emblématique."},{"id":"BASA","slug":"BASAA","label":"Basaa (Ndog-Bacek)","emicName":"Ndog-Bacek","meaning":"« descendance de Bacek », l'ancêtre fondateur","region":"Littoral","family":"Bantou","fc":"bantu","numeralSystem":"inconnu","origins":["Cameroun"],"recordId":"BASA_2020_001","overview":"Les Ndog-Bacek forment le noyau majoritaire d'un ensemble basaa qui a absorbé plusieurs groupes voisins (Lìmùù, Liŋgɔ̀k, Mbamndân), lesquels ont adopté le bàsàa. Installés sur leur terre ancestrale après une migration partie de Ŋgɔk-Lituɓa, ils vivent principalement du cacao, du palmier et de la banane, dans une société patrilinéaire où les décisions se prennent par consensus."},{"id":"BULU","slug":"BULU","label":"Bulu (groupement Yekombo)","emicName":"Mboŋgui","meaning":"« la chefferie puissante »","region":"Sud","family":"Bantou","fc":"bantu","numeralSystem":"inconnu","origins":[],"recordId":"BULU_2020_001","overview":"Majoritaires dans leur groupement, au contact des Ngoe et des Esse, les Bulu de Yekombo vivent du cacao, des cultures vivrières, de la pêche et de la vannerie. Sociétés de familles et de chefferies hiérarchisées, ils se réunissaient sous l'arbre adum pour consulter les ancêtres ; le christianisme a remplacé ces cultes, mais la cuisine, la danse eɲəŋə et le bikutsi demeurent."},{"id":"ETON","slug":"ETON","label":"Éton (Edingding)","emicName":"Edingding","meaning":"nom d'un arbre ; pour les voisins, le nom d'un grand guerrier","region":"Centre","family":"Bantou","fc":"bantu","numeralSystem":"inconnu","origins":["Cameroun"],"recordId":"ETON_2020_001","overview":"Les Edingding (Mengara), l'un des grands lignages éton de la Lékié, voisinent avec les Medoum, Batchenga, Mvele et Mvog-Beloa. Venus de l'autre rive de la Sanaga par Emana, Talla, Saa et Elig-Fomo, ils ont acquis leurs terres par amitié. Société égalitaire et hospitalière, ils cultivent le cacao et dansent le bikutsi."},{"id":"EWON","slug":"EWONDO","label":"Ewondo (Mvog Tsung, Mbala)","emicName":"Efulán məyoŋ","meaning":"« le mélange des peuples »","region":"Centre","family":"Bantou","fc":"bantu","numeralSystem":"inconnu","origins":["Cameroun"],"recordId":"EWON_2020_001","overview":"Au cœur de Yaoundé, Efoulan se décrit comme un « mélange des peuples » : les Ewondo y vivent avec des Basaa, des gens des Grassfields et du Nord. Comme tous les Beti, ils disent avoir franchi la Sanaga sur le dos d'un serpent mythique. Catholiques, très urbanisés, ils gardent l'olugu, le respect des aînés, et la musique du balafon et du tam-tam."},{"id":"FONG","slug":"FONG","label":"Foŋ (Mvog Mezanga)","emicName":"Foŋ","meaning":"","region":"Sud","family":"Bantou","fc":"bantu","numeralSystem":"inconnu","origins":["Cameroun"],"recordId":"FONG_2020_001","overview":"Majoritaires dans leur localité de Zoétélé, les Foŋ côtoient les Esə, Ŋdoŋ et Jəmdək, tous bulu. Comme les autres Beti, ils disent venir de l'autre rive de la Sanaga. Organisés autour de la parenté et de spécialités transmises (danseurs, chasseurs, menuisiers), ils vivent du cacao, du bois et des bâtons de manioc, et dansent l'eɲəŋgə au son du mvet."},{"id":"FANG","slug":"FANG","label":"Fang (Esaɲan)","emicName":"Esaɲan","meaning":"« ceux de Ɲan », les enfants de Ɲan","region":"Sud","family":"Bantou","fc":"bantu","numeralSystem":"inconnu","origins":["Cameroun"],"recordId":"FANG_2020_001","overview":"Les Esaɲan de Minko'o, Fang majoritaires dans leur zone, vivent aux côtés des Bulu, des Zaman et des Baka. Leur langue s'étend de l'Océan et de la Vallée-du-Ntem au nord du Gabon et du Congo. Cacao, élevage, chasse et viande de brousse au plantain font leur quotidien ; chaque 1er janvier, la visite des tombes réunit tout le village."},{"id":"FOMB","slug":"FOMBO","label":"Fɔ́mbɔ́ (Ndog-Banɔl)","emicName":"Ndog-Banɔl","meaning":"les villages issus de l'ancêtre Banɔl","region":"Littoral","family":"Bantou","fc":"bantu","numeralSystem":"inconnu","origins":["Cameroun"],"recordId":"FOMB_2020_001","overview":"Les Ndog-Banɔl, que leurs voisins appellent Fɔmbɔ, forment un petit ensemble de 21 villages, au contact du canton Inoubou-Nord, des Alinga, des Basaa de la Sanaga-Maritime, des Ndog-Biakat et des Yengui. Installés sur une terre d'accueil, ancien camp militaire, ils vivent du cacao, des cultures vivrières et de la cueillette."},{"id":"MALI","slug":"MALIMBA","label":"Malimba","emicName":"Mulimba / Balimba","meaning":"les enfants de l'ancêtre Elimbe","region":"Littoral","family":"Bantou","fc":"bantu","numeralSystem":"inconnu","origins":["Congo"],"recordId":"MALI_2020_001","overview":"Petit peuple sawa de pêcheurs, les Malimba se disent descendants d'Elimbe, fils de Bendi, l'ancêtre venu du Congo. Installés le long de la Sanaga et de l'océan, entre Dizangué et Logasse, aux côtés des Duala, Bakoko, Banen et Babimbi, ils honorent les esprits de l'eau par le jengu et fêtent chaque année l'ihangabinde."},{"id":"MNGS","slug":"MANGUISSA","label":"Manguissa (canton Ebombo)","emicName":"Batcheba, Esogo","meaning":"Ebombo signifie « le bloc »","region":"Centre","family":"Bantou","fc":"bantu","numeralSystem":"inconnu","origins":["Cameroun"],"recordId":"MNGS_2020_001","overview":"Le canton Ebombo, douze villages manguissa, vit en harmonie avec le groupement Engba, les Begnia Bega, les gens de la Sanaga et le canton Saa, et accueille Haoussa, gens de Bamenda, Bamiléké et Maliens. Venus, comme les autres Beti, de l'autre rive de la Sanaga, les Manguissa cultivent cacao, arachide et concombre et initient chaque année leurs jeunes à la danse des minken mimbon."},{"id":"MBER","slug":"MBERE","label":"Mbéré","emicName":"Mbere","meaning":"« le massage »","region":"Nord","family":"Adamaoua","fc":"adamawa","numeralSystem":"inconnu","origins":[],"recordId":"MBER_2020_001","overview":"Premiers occupants du département qui porte leur nom, les Mbéré vivent en petit nombre au milieu des Bororo et des Peuls, dont ils parlent surtout la langue. Très islamisés, ils sont réputés comme maîtres du miel et comme guérisseurs ; agriculture, élevage de chèvres et de moutons et poterie complètent leurs activités."},{"id":"MVUM","slug":"MVUMBO","label":"Kwasio (Mvumbo et Mabi)","emicName":"Mvùbò et Maɓí (Kwàsíó)","meaning":"Mvumbo vient du tronc de l'arbre sìó ; Kwàsíó, « avoir creusé le tronc sìó »","region":"Sud","family":"Bantou","fc":"bantu","numeralSystem":"inconnu","origins":["Togo","Cameroun"],"recordId":"MVUM_2020_001","overview":"Les Kwasio, Mvumbo (Ngoumba) et Mabi (Mabea), vivent dans la région de Kribi au côté des Batanga, Bulu, Fang et Yasa, avec des parents au Gabon et en Guinée équatoriale. Pêche, chasse et cultures de manioc, plantain et macabo les font vivre ; les fêtes Ngúmá màɓi et M̀pfúl Mvumbɔ célèbrent leur identité."},{"id":"OSSA","slug":"OSSANANGA","label":"Mvele de Ntui (Biatsota)","emicName":"Biatsota","meaning":"« la famille du chef Tsota »","region":"Centre","family":"Bantou","fc":"bantu","numeralSystem":"inconnu","origins":[],"recordId":"OSSA_2020_001","overview":"Les Biatsota, Mvele de Ntui, vivent en bon voisinage avec les Djané, Nkulutu et Biindandjengué, et parlent l'ossananga, dont on trouve des locuteurs jusqu'aux confins de l'Adamaoua. Catholiques de longue date, ils vivent du cacao, de la pêche, du commerce et des cultures vivrières, et partagent bien des usages avec les Eton."},{"id":"VUTE","slug":"VUTE","label":"Vute (Babute)","emicName":"Vute (Babute)","meaning":"","region":"Centre","family":"Bantou","fc":"bantu","numeralSystem":"inconnu","origins":["Cameroun"],"recordId":"VUTE_2020_001","overview":"Peuple de grands guerriers venu de l'Adamaoua, les Vute (Babute) ont conquis leurs terres en franchissant la Sanaga près de Mbandjock, et voisinent aujourd'hui avec les Eton, les Mbamois, les Nanga, les Yezoum et les Mvele. Chefferie héréditaire, chasse, pêche et agriculture, couscous de manioc et danse guerrière au tambour djiiŋ les caractérisent."},{"id":"YEZO","slug":"YEZOUM","label":"Yezoum (Lembe-Yezoum)","emicName":"Yəzoum","meaning":"","region":"Centre","family":"Bantou","fc":"bantu","numeralSystem":"inconnu","origins":["Cameroun"],"recordId":"YEZO_2020_001","overview":"Majoritaires dans l'arrondissement de Lembe-Yezoum, les Yezoum, venus de l'Adamaoua, côtoient Vute, Yebekolo, Nanga, Mvele, Eton et Mbamois. Leur chefferie dynastique est tenue par la grande famille Angoula. Commerce, cultures de rente et vivrières, vannerie et fabrication d'instruments de musique les font vivre ; leur culture et leur langue sont proches de celles des Ewondo."},{"id":"NGBA","slug":"NGEMBA","label":"Ngemba (Bamoungoum)","emicName":"Bamoungoum / Mʉngum","meaning":"« les gens nobles »","region":"Ouest","family":"Bantoïde (Grassfields)","fc":"bantoid","numeralSystem":"inconnu","origins":["Cameroun"],"recordId":"NGBA_2020_001","overview":"Fondé par un chasseur en quête de terres, le royaume bamoungoum, majoritaire chez lui, accueille Haoussa, gens de Mbouda, Bansoa et Bamoun. Chefferie structurée de notables et de sociétés secrètes protectrices, culte des ancêtres et des crânes, grotte refuge de Ndə nə kaŋ nsaŋ : les Bamoungoum célèbrent tous les deux ans, pendant quatre mois, leur grande fête Nə kaŋ pə Muŋgum."},{"id":"BTNG","slug":"BATANGA","label":"Batanga (Ɓanɔhɔ)","emicName":"Batanga (coutume ndowɛ)","meaning":"peut-être « ceux de Ntanga »","region":"Sud","family":"Bantou","fc":"bantu","numeralSystem":"inconnu","origins":["Congo","Nigeria"],"recordId":"BTNG_2020_001","overview":"Peuple de pêcheurs de la côte de Kribi, les Batanga sont venus par la côte depuis la frontière Nigeria-Cameroun et gardent des liens avec des peuples de langue ndà du Gabon, de Guinée équatoriale et au-delà. Minoritaires parmi Mabea, Bulu, Bakoko et Yasa, ils vivent au rythme de la mer, des esprits de l'eau et de la fête du Mayi, qui commémore le retour d'exil de 1916."},{"id":"LAGW","slug":"LAGWANE","label":"Lagwane (Kotoko de Logone-Birni)","emicName":"Lagwane","meaning":"« les habitants du sultanat »","region":"Extrême-Nord","family":"Tchadique","fc":"chadic","numeralSystem":"inconnu","origins":["Yémen","Soudan","Tchad"],"recordId":"LAGW_2020_001","overview":"Les Lagwane, Kotoko du sultanat de Logone-Birni, vivent de la pêche et de l'agriculture le long du Logone, en symbiose avec Massa, Mousgoum, Arabes et Kanuri. Héritiers des Sao, venus du Yémen par le Soudan, le Kanem-Bornou et le Baguirmi, ils honorent la déesse de l'eau avant les grandes pêches et dansent le kounkouli à la sortie du sultan."},{"id":"CARB","slug":"CHADIAN_ARABIC","label":"Arabes Choa (Garoua)","emicName":"Arabe","meaning":"","region":"Nord","family":"Sémitique (arabe)","fc":"other","numeralSystem":"inconnu","origins":["Tchad"],"recordId":"CARB_2020_001","overview":"Minoritaires à Garoua, les Arabes Choa vivent parmi les Fali, Guiziga, Bata et Peuls, dont ils partagent le fulfulde. Arrivés il y a trois siècles du Ouaddaï (Abéché, Tchad) par Mora, ils ont fait de leur mosquée tricentenaire et de la chefferie leurs lieux de mémoire. Petit commerce, tontines et restauration occupent les femmes ; le lait et la boule de sorgho sont au cœur de la cuisine."},{"id":"BAYA","slug":"BAYA","label":"Baya (Bouforo, Meiganga)","emicName":"Bouforo","meaning":"évoque des interdits alimentaires liés à la viande","region":"Adamaoua","family":"Oubanguien","fc":"ubangian","numeralSystem":"inconnu","origins":["Soudan","République Centrafricaine","Nigeria"],"recordId":"BAYA_2020_001","overview":"Majoritaires à Meiganga, où ils côtoient Toupouri, Bororo, Bamiléké et Haoussa, les Baya (Bouforo) appartiennent au grand ensemble gbaya qui s'étend du Soudan et de la Centrafrique au Congo et au Nigeria. Société égalitaire mais attachée au respect, ils cultivent manioc, maïs, patate, haricot et igname, et l'école du labi, véritable formation de guerriers, reste au cœur de leur éducation."},{"id":"DII","slug":"DII","label":"Dii (Mbé)","emicName":"Di᷅i᷅","meaning":"« ceux qui sont noirs »","region":"Adamaoua","family":"Adamaoua","fc":"adamawa","numeralSystem":"inconnu","origins":["Cameroun"],"recordId":"DII_2020_001","overview":"Majoritaires dans le lamidat de Mbé, les Dii vivent avec des Peuls, Moundang, Toupouri, Mada, Mafa et Bamiléké. Venus du Mayo-Rey, ils ont trouvé à Mbé un lieu de refuge. La chefferie, le prêtre circonciseur et le forgeron organisent la société ; la circoncision, avec sa danse mbé de trois jours, en est le grand rite."},{"id":"FDJT","slug":"FONDJENTI","label":"Fondjenti (Ntî)","emicName":"Ntî","meaning":"« préparer quelque chose à fond »","region":"Ouest","family":"Bantoïde (Grassfields)","fc":"bantoid","numeralSystem":"inconnu","origins":["Cameroun"],"recordId":"FDJT_2020_001","overview":"La chefferie de Fondjenti réunit des Ntî venus de Bamwa, des Fondonti et les Bapoutchis trouvés sur place ; tous parlent le nufi. Royauté dynastique, confréries qui délibèrent, culte des crânes et place sacrée du palmier, « l'arbre qui donne tout », caractérisent ce peuple fier de son exogamie et de son hospitalité."},{"id":"GHOM","slug":"GHOMALA","label":"Ghomala' (Bapa)","emicName":"Pepa","meaning":"« les sentinelles de guerre »","region":"Ouest","family":"Bantoïde (Grassfields)","fc":"bantoid","numeralSystem":"inconnu","origins":["Cameroun"],"recordId":"GHOM_2020_001","overview":"Peuple des Hauts-Plateaux, les Bapa (Pepa) se sont installés sur un site accidenté jamais occupé avant eux, riche en chutes, grottes et forêts sacrées. Chefferie héréditaire liée aux chefferies sœurs comme Batié, culte des crânes et des ancêtres, et grande fête biennale du kan, où les jeunes garçons sont initiés, font leur identité."},{"id":"MAKA","slug":"MAKA","label":"Maka (Bebend)","emicName":"Bebend","meaning":"du nom de l'ancêtre Bebend","region":"Est","family":"Bantou","fc":"bantu","numeralSystem":"inconnu","origins":["Cameroun"],"recordId":"MAKA_2020_001","overview":"Les Maka Bebend forment un clan maka relativement isolé mais lié aux autres groupes maka de l'Est et aux Ngoumba du Sud. Venus de l'Adamaoua au XVIIe siècle avec les Maka Bwanz et Maka Ebe, ils vivent d'agriculture, de chasse, de pêche et d'artisanat, et dansent le mpiné, autrefois au retour de la guerre, autour du feu."},{"id":"BODI","slug":"BODIMAN","label":"Bodiman","emicName":"Bodiman","meaning":"","region":"Littoral","family":"Bantou","fc":"bantu","numeralSystem":"inconnu","origins":["Congo"],"recordId":"MBOD_2020_001","overview":"Petit peuple sawa des rives du Wouri, les Bodiman vivent parmi les Ewodi, Duala, Banen et Basaa de Yabassi, dont ils parlent les langues. Venus du Congo, pêcheurs et agriculteurs, ils ont pour symboles la pirogue, la pagaie et le crocodile, et célèbrent chaque décembre le Suunɛm Ebanabamboa, devenu festival du canton bodiman."},{"id":"TUPU","slug":"TUPURI","label":"Toupouri (Dziguilao)","emicName":"Toupouri","meaning":"","region":"Extrême-Nord","family":"Adamaoua","fc":"adamawa","numeralSystem":"inconnu","origins":["Soudan","Tchad"],"recordId":"TUPU_2020_001","overview":"Majoritaires dans leur zone, les Toupouri, longtemps très isolés, côtoient aujourd'hui Peuls et Moundang. Venus du Soudan par le Tchad, avec lequel ils vivent « en fraternité absolue », ils organisent leur société autour des doore (chefs de terre), des notables de clan et des initiés maagay. Agriculture, élevage, bil-bil et poterie les font vivre, et la fête du coq, le feo kake, ouvre chaque année en octobre la nouvelle année."},{"id":"FLFD","slug":"FULFULDE","label":"Peuls (Guidiguis)","emicName":"Poulo (Pullo)","meaning":"","region":"Extrême-Nord","family":"Atlantique (peul)","fc":"atlantic","numeralSystem":"inconnu","origins":["Mali","Nigeria","Guinée"],"recordId":"FLFD_2020_001","overview":"Majoritaires à Guidiguis, où ils vivent avec les Toupouri, les Peuls parlent le fulfulde, langue répandue du Sénégal au Cameroun. Venus du Mali par le Nigeria et la Guinée, ils sont organisés en lamidat (lamido, kaigama, kofa) et ont profondément modelé leur culture sur l'islam ; élevage, commerce et vente du lait les font vivre."},{"id":"KALI","slug":"KALI","label":"Kali (Bèlèl)","emicName":"Bèlèl","meaning":"« le lieu des phacochères »","region":"Nord","family":"Adamaoua","fc":"adamawa","numeralSystem":"inconnu","origins":["Cameroun"],"recordId":"KALI_2020_001","overview":"Les Kali de Bèlèl, peuple de langue mboum, vivent en minorité parmi les Peuls, Dourou, Haoussa, Beti, Basaa, Toupouri et Bamiléké. Venus du Mayo-Rey (Lugéré Baka) par Mbang, ils gardent une chefferie familiale et vivent d'agriculture et de commerce. La danse dzwùŋ accompagne circoncisions, battage du mil et obsèques, et la fête du mil, deux fois par an, chasse les maladies."},{"id":"PERE","slug":"PERE","label":"Pɛrɛ (Tignère)","emicName":"Pɛ̀rɛ̂","meaning":"« les civilisés »","region":"Adamaoua","family":"Adamaoua","fc":"adamawa","numeralSystem":"inconnu","origins":["Nigeria"],"recordId":"PERE_2020_001","overview":"Majoritaires dans leur zone, les Pɛrɛ vivent avec les Mboum, Haoussa, Gbaya et Peuls, dont ils parlent souvent les langues. Venus de Gañe au Nigeria par Gɛŋfəlabo et Almé, ils ont une parenté matrilinéaire, un chef et des rois, et célèbrent en mars le mburi pour appeler la bénédiction. Agriculture, commerce et un artisanat varié les font vivre."}],"edges":[{"source":"BAFO","target":"BKKO","type":"SIMILAIRE_LEXICALEMENT","plane":"ling","weight":0.122,"label":"Sim. lexicale sur 156 formules"},{"source":"BAFO","target":"GBYA","type":"SIMILAIRE_LEXICALEMENT","plane":"ling","weight":0.132,"label":"Sim. lexicale sur 135 formules"},{"source":"BAFO","target":"GUIZ","type":"SIMILAIRE_LEXICALEMENT","plane":"ling","weight":0.126,"label":"Sim. lexicale sur 155 formules"},{"source":"BAFO","target":"KTKK","type":"SIMILAIRE_LEXICALEMENT","plane":"ling","weight":0.126,"label":"Sim. lexicale sur 146 formules"},{"source":"BAFO","target":"LIMB","type":"SIMILAIRE_LEXICALEMENT","plane":"ling","weight":0.164,"label":"Sim. lexicale sur 144 formules"},{"source":"BAFO","target":"MNDG","type":"SIMILAIRE_LEXICALEMENT","plane":"ling","weight":0.148,"label" <script>
// ── Colour helpers ──────────────────────────────────────────────────────────
const PLANE_COLOR = {
  hist:   '#7c3aed',
  ling:   '#1d4ed8',
  geo:    '#059669',
  social: '#d97706',
  cogn:   '#be185d',
};
const PLANE_LABEL = {
  hist:'Historique', ling:'Linguistique',
  geo:'Géographique', social:'Social', cogn:'Cognitif',
};
const FC_COLOR = {
  bantoid:    '#818cf8',
  bantu:      '#22d3ee',
  ubangian:   '#f97316',
  adamawa:    '#84cc16',
  chadic:     '#facc15',
  nilosaharan:'#e879f9',
  atlantic:   '#fb7185',
  other:      '#94a3b8',
};
const FC_LABEL = {
  bantoid:    'Bantoïde (Grassfields)',
  bantu:      'Bantou',
  ubangian:   'Oubanguien',
  adamawa:    'Adamaoua',
  chadic:     'Tchadique',
  nilosaharan:'Nilo-saharien',
  atlantic:   'Atlantique (peul)',
  other:      'Sémitique (arabe)',
};

// ── State ───────────────────────────────────────────────────────────────────
let cy, graphData;
let activePlanes = new Set(['hist','ling','geo','social','cogn']);
const mqMobile = window.matchMedia('(max-width: 767px)');
const isMobile = () => mqMobile.matches;
let minWeight = 0.10;
let activeLayout = 'cose';
let baseZoom = 1;   // zoom level of the "whole graph" view

// ── Inline data (no server required) ────────────────────────────────────────
(function() {
  const data = RHIZOME_DATA;
  graphData = data;
  init(data);
})();

function init(data) {
  // Sync weight slider with the initial threshold
  document.getElementById('weight-slider').value = Math.round(minWeight * 100);
  document.getElementById('weight-val').textContent = minWeight.toFixed(2);

  // Build community list sidebar
  buildSidebar(data.nodes);
  buildLegend(data.nodes);

  // Build Cytoscape elements
  const elements = buildElements(data);

  cy = cytoscape({
    container: document.getElementById('cy'),
    elements,
    style: cyStyles(),
    layout: layoutConfig(),
    wheelSensitivity: 0.3,
    minZoom: 0.1,
    maxZoom: 5,
    pixelRatio: Math.min(window.devicePixelRatio || 1, 2),
    hideEdgesOnViewport: isMobile(),   // smoother pan/zoom on phones
    textureOnViewport: false,
  });

  cy.ready(() => {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('stats-bar').classList.remove('hidden');
    document.getElementById('map-controls').classList.remove('hidden');
    updateStats();
    baseZoom = cy.zoom(); updateLabelVisibility();
    const h = decodeURIComponent(location.hash.replace('#', ''));
    if (h && cy.getElementById(h).length) {
      const n = cy.getElementById(h);
      setTimeout(() => { showDetail(n); focusOn(n, true); }, 900);
    }
    if (isMobile()) {
      const hint = document.getElementById('touch-hint');
      hint.classList.remove('hidden');
      setTimeout(() => { hint.style.opacity = '0'; }, 3500);
      setTimeout(() => { hint.classList.add('hidden'); }, 4300);
    }
  });

  cy.on('tap', 'node', e => { showDetail(e.target); focusOn(e.target); });
  cy.on('zoom', updateLabelVisibility);
  cy.on('layoutstop', () => { baseZoom = cy.zoom(); updateLabelVisibility(); });
  cy.on('tap', e => { if (e.target === cy) closeDetail(); });

  setupControls();
}

// ── Cytoscape elements ───────────────────────────────────────────────────────
function buildElements(data) {
  const nodes = data.nodes.map(n => ({
    data: {
      id:    n.id,
      label: n.label,
      fc:    n.fc || 'other',
      ...n,
    }
  }));

  const edges = data.edges
    .filter(e => activePlanes.has(e.plane) && e.weight >= minWeight)
    .map(e => ({
      data: {
        id:     `${e.source}-${e.type}-${e.target}`,
        source: e.source,
        target: e.target,
        plane:  e.plane,
        weight: e.weight,
        type:   e.type,
        label:  e.label,
      }
    }));

  return [...nodes, ...edges];
}

// ── Cytoscape styles ──────────────────────────────────────────────────────────
function cyStyles() {
  return [
    {
      selector: 'node',
      style: {
        'background-color':   ele => FC_COLOR[ele.data('fc')] || '#94a3b8',
        'label':              'data(label)',
        'color':              '#1e293b',
        'font-size':          isMobile() ? '13px' : '11px',
        'font-weight':        '700',
        'text-valign':        'bottom',
        'text-halign':        'center',
        'text-margin-y':      4,
        'text-outline-color': '#ffffff',
        'text-outline-width': 2,
        'width':              isMobile() ? 28 : 34,
        'height':             isMobile() ? 28 : 34,
        'border-color':       '#ffffff',
        'border-width':       2,
        'shadow-blur':        8,
        'shadow-color':       '#0000001a',
        'shadow-offset-x':    0,
        'shadow-offset-y':    2,
        'transition-property':'background-color, border-color, width, height',
        'transition-duration':'0.15s',
      }
    },
    {
      selector: 'node:selected',
      style: {
        'border-color': '#6366f1',
        'border-width': 3,
        'width': 42, 'height': 42,
      }
    },
    {
      selector: 'node.highlighted',
      style: { 'opacity': 1 }
    },
    {
      // Mobile overview: hide labels until the user zooms in (avoids unreadable clutter)
      selector: 'node.nolabel',
      style: { 'label': '' }
    },
    {
      selector: 'node.nolabel.highlighted, node.nolabel:selected',
      style: { 'label': 'data(label)' }
    },
    {
      selector: 'node.dimmed',
      style: { 'opacity': 0.2 }
    },
    {
      selector: 'edge',
      style: {
        'width':            ele => Math.max(isMobile() ? 0.6 : 1, ele.data('weight') * (isMobile() ? 4 : 6)),
        'line-color':       ele => PLANE_COLOR[ele.data('plane')] || '#94a3b8',
        'opacity':          0.55,
        'curve-style':      'bezier',
        'target-arrow-shape': 'none',
        'transition-property':'opacity, width',
        'transition-duration':'0.15s',
      }
    },
    {
      selector: 'edge.highlighted',
      style: { 'opacity': 0.9 }
    },
    {
      selector: 'edge.dimmed',
      style: { 'opacity': 0.05 }
    },
  ];
}

// ── Layout configs ────────────────────────────────────────────────────────────
function layoutConfig(name) {
  name = name || activeLayout;
  const m = isMobile();
  const base = { animate: !m, animationDuration: 600, fit: true, padding: m ? 16 : 30 };
  if (name === 'cose') return {
    ...base, name: 'cose',
    idealEdgeLength: m ? 90 : 120, nodeOverlap: 20,
    nodeRepulsion: () => 8000,
    edgeElasticity: () => 32,
    gravity: 0.2, numIter: 1000, coolingFactor: 0.95,
  };
  if (name === 'circle') return m ? { ...base, name: 'circle' } : { ...base, name: 'circle', radius: 280, padding: 40 };
  return { ...base, name: 'grid', padding: m ? 16 : 30 };
}

// ── Sidebar community list ────────────────────────────────────────────────────
function buildSidebar(nodes) {
  const el = document.getElementById('community-list');
  document.getElementById('node-count').textContent = `(${nodes.length})`;
  nodes.sort((a,b) => a.label.localeCompare(b.label)).forEach(n => {
    const dot = document.createElement('div');
    dot.className = 'flex items-center gap-2 px-3 py-1.5 hover:bg-slate-50 cursor-pointer text-sm';
    dot.dataset.id = n.id;
    dot.innerHTML = `
      <span class="w-3 h-3 rounded-full flex-shrink-0" style="background:${FC_COLOR[n.fc]||'#94a3b8'}"></span>
      <span class="truncate">${n.label}</span>
      <span class="ml-auto text-xs text-slate-400 flex-shrink-0">${n.region.split(' / ')[0]}</span>
    `;
    dot.addEventListener('click', () => {
      if (!cy) return;
      const node = cy.getElementById(n.id);
      if (node.length) {
        closeSidebar();
        showDetail(node);
        focusOn(node, true);
      }
    });
    el.appendChild(dot);
  });
}

// ── Legend ───────────────────────────────────────────────────────────────────
function buildLegend(nodes) {
  const fcs = [...new Set(nodes.map(n => n.fc))];
  const el = document.getElementById('legend');
  fcs.forEach(fc => {
    const row = document.createElement('div');
    row.className = 'flex items-center gap-2 text-xs text-slate-600';
    row.innerHTML = `
      <span class="w-3 h-3 rounded-sm flex-shrink-0" style="background:${FC_COLOR[fc]}"></span>
      <span>${FC_LABEL[fc] || fc}</span>
    `;
    el.appendChild(row);
  });
}

// ── Detail panel ──────────────────────────────────────────────────────────────
function showDetail(node) {
  const d = node.data();
  document.getElementById('dp-title').textContent = d.label;
  document.getElementById('dp-emic').textContent = d.emicName ? `« ${d.emicName} »` : '';

  const body = document.getElementById('dp-body');
  body.innerHTML = '';

  // Meaning
  if (d.meaning) {
    body.innerHTML += section('Signification du nom', `<em>${d.meaning}</em>`);
  }


  // Essentials
  body.innerHTML += section('Profil', `
    <div class="space-y-1">
      <div><span class="text-slate-400">Région :</span> <strong>${d.region||'—'}</strong></div>
      <div><span class="text-slate-400">Famille :</span> <strong>${d.family||'—'}</strong></div>
      ${d.emicName ? `<div><span class="text-slate-400">Nom propre :</span> <strong>${d.emicName}</strong></div>` : ''}
    </div>
  `);

  // Connected communities
  const connEdges = node.connectedEdges();
  const connNodes = connEdges.connectedNodes().not(node);
  if (connNodes.length) {
    const byPlane = {};
    connEdges.forEach(e => {
      const p = e.data('plane');
      const other = e.source().id() === d.id ? e.target() : e.source();
      if (!byPlane[p]) byPlane[p] = [];
      byPlane[p].push({ label: other.data('label'), w: e.data('weight') });
    });
    let html = '';
    Object.keys(byPlane).sort().forEach(p => {
      const items = byPlane[p].sort((a,b) => b.w - a.w);
      const tags = items.map(x =>
        `<span class="tag" style="background:${PLANE_COLOR[p]}22;color:${PLANE_COLOR[p]}">${x.label}</span>`
      ).join('');
      html += `<div class="mb-2"><div class="text-xs font-bold text-slate-400 mb-1">${PLANE_LABEL[p]}</div>${tags}</div>`;
    });
    body.innerHTML += section(`Connexions (${connNodes.length})`, html);
  }

  // Fiche culturelle (synthèse) + lien vers la fiche complète
  if (d.overview) {
    body.innerHTML += section('Fiche culturelle', `
      <p class="text-sm text-slate-600 leading-relaxed">${d.overview}</p>
      <a href="index.html#/cultures/${d.id}" class="mt-3 inline-flex items-center gap-1 rounded-lg bg-emerald-600 text-white text-sm font-semibold px-3 py-2">
        Ouvrir la fiche complète et les leçons →
      </a>`);
  }

  // Highlight neighbourhood
  cy.elements().addClass('dimmed');
  node.removeClass('dimmed').addClass('highlighted');
  node.closedNeighborhood().removeClass('dimmed').addClass('highlighted');

  const panel = document.getElementById('detail-panel');
  panel.scrollTop = 0;
  panel.classList.add('open');
}

function section(title, content) {
  return `<div>
    <div class="text-xs font-bold uppercase tracking-wide text-slate-400 mb-1.5">${title}</div>
    <div class="text-sm leading-relaxed">${content}</div>
  </div>`;
}

function closeDetail() {
  document.getElementById('detail-panel').classList.remove('open');
  if (cy) {
    cy.elements().removeClass('dimmed highlighted');
  }
}

document.getElementById('dp-close').addEventListener('click', closeDetail);

// ── Controls ──────────────────────────────────────────────────────────────────
function setupControls() {

  // Plane filter buttons
  document.querySelectorAll('.plane-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const plane = btn.dataset.plane;
      if (activePlanes.has(plane)) {
        activePlanes.delete(plane);
        btn.classList.remove('active');
      } else {
        activePlanes.add(plane);
        btn.classList.add('active');
      }
      rebuildEdges();
    });
  });

  // Weight slider
  const slider = document.getElementById('weight-slider');
  const weightVal = document.getElementById('weight-val');
  slider.addEventListener('input', () => {
    minWeight = parseInt(slider.value) / 100;
    weightVal.textContent = minWeight.toFixed(2);
    rebuildEdges();
  });

  // Layout buttons
  document.querySelectorAll('.layout-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.layout-btn').forEach(b => {
        b.className = b.className.replace('bg-indigo-100 text-indigo-700', 'bg-slate-100 text-slate-600');
      });
      btn.className = btn.className.replace('bg-slate-100 text-slate-600', 'bg-indigo-100 text-indigo-700');
      activeLayout = btn.dataset.layout;
      cy.layout(layoutConfig()).run();
    });
  });

  // Fit button
  document.getElementById('btn-fit').addEventListener('click', () => {
    cy.fit(cy.elements(':visible'), isMobile() ? 16 : 40);
    baseZoom = cy.zoom(); updateLabelVisibility();
  });

  // Zoom buttons (useful on touch screens)
  const zoomBy = f => {
    const c = { x: cy.width() / 2, y: cy.height() / 2 };
    cy.animate({ zoom: { level: cy.zoom() * f, renderedPosition: c }, duration: 200 });
  };
  document.getElementById('btn-zoom-in').addEventListener('click', () => zoomBy(1.4));
  document.getElementById('btn-zoom-out').addEventListener('click', () => zoomBy(1 / 1.4));

  // Mobile drawer
  document.getElementById('btn-sidebar').addEventListener('click', openSidebar);
  document.getElementById('btn-sidebar-close').addEventListener('click', closeSidebar);
  document.getElementById('sidebar-backdrop').addEventListener('click', closeSidebar);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeSidebar(); closeDetail(); } });

  // Keep the graph sized correctly on rotation / resize
  let rt;
  window.addEventListener('resize', () => {
    clearTimeout(rt);
    rt = setTimeout(() => { cy.resize(); cy.fit(cy.elements(':visible'), isMobile() ? 16 : 40); baseZoom = cy.zoom(); updateLabelVisibility(); }, 200);
  });

  // Search
  const search = document.getElementById('search');
  search.addEventListener('input', () => {
    const q = search.value.toLowerCase().trim();
    document.querySelectorAll('#community-list > div').forEach(el => {
      const matches = !q || el.textContent.toLowerCase().includes(q);
      el.style.display = matches ? '' : 'none';
    });
    if (q.length >= 2 && cy) {
      cy.nodes().forEach(n => {
        if (n.data('label').toLowerCase().includes(q)) {
          n.removeClass('dimmed').addClass('highlighted');
        } else {
          n.removeClass('highlighted').addClass('dimmed');
        }
      });
    } else if (!q && cy) {
      cy.elements().removeClass('dimmed highlighted');
    }
  });
}

// ── Label visibility (mobile) ────────────────────────────────────────────────
function updateLabelVisibility() {
  if (!cy) return;
  const hide = isMobile() && cy.zoom() < baseZoom * 1.6;
  cy.batch(() => {
    if (hide) cy.nodes().addClass('nolabel'); else cy.nodes().removeClass('nolabel');
  });
}

// ── Focus a node: on phones, keep it visible ABOVE the bottom sheet ─────────
function focusOn(node, withNeighbours) {
  const eles = withNeighbours ? node.closedNeighborhood() : node;
  if (!isMobile()) {
    if (withNeighbours) cy.animate({ fit: { eles, padding: 80 }, duration: 500 });
    return;
  }
  const sheet = document.getElementById('detail-panel');
  const sheetH = Math.min(sheet.offsetHeight || 0, window.innerHeight * 0.55);
  const pad = 30;
  const availW = cy.width(), availH = Math.max(120, cy.height() - sheetH);
  const bb = eles.boundingBox();
  let zoom = withNeighbours
    ? Math.min((availW - 2 * pad) / Math.max(bb.w, 1), (availH - 2 * pad) / Math.max(bb.h, 1))
    : Math.max(cy.zoom(), baseZoom * 1.8);
  zoom = Math.max(cy.minZoom(), Math.min(zoom, 2.5));
  const cx = bb.x1 + bb.w / 2, cyy = bb.y1 + bb.h / 2;
  cy.animate({ zoom, pan: { x: availW / 2 - zoom * cx, y: availH / 2 - zoom * cyy }, duration: 450 });
}

// ── Mobile drawer helpers ────────────────────────────────────────────────────
function openSidebar() {
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('sidebar-backdrop').classList.add('open');
  document.getElementById('btn-sidebar').setAttribute('aria-expanded', 'true');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebar-backdrop').classList.remove('open');
  const b = document.getElementById('btn-sidebar');
  if (b) b.setAttribute('aria-expanded', 'false');
}

// ── Rebuild edge visibility ───────────────────────────────────────────────────
function rebuildEdges() {
  if (!cy || !graphData) return;
  // Remove all edges and re-add filtered set
  cy.edges().remove();
  const filtered = graphData.edges
    .filter(e => activePlanes.has(e.plane) && e.weight >= minWeight)
    .map(e => ({
      data: {
        id:     `${e.source}-${e.type}-${e.target}`,
        source: e.source,
        target: e.target,
        plane:  e.plane,
        weight: e.weight,
        type:   e.type,
        label:  e.label,
      }
    }));
  cy.add(filtered);
  cy.style(cyStyles()); // re-apply styles to new elements
  updateStats();
}

function updateStats() {
  if (!cy) return;
  document.getElementById('stat-nodes').textContent = cy.nodes().length;
  document.getElementById('stat-edges').textContent = cy.edges().length;
}
</script>
