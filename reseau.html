<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>CamRhizome — Réseau Intercommunautaire du Cameroun · Likalo</title>
<link rel="icon" href="assets/favicon.svg"/>

<!-- Tailwind CSS (same as main site) -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- Cytoscape.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>

<style>
  :root {
    --hist:   #7c3aed; --hist-bg:   #ede9fe;
    --ling:   #1d4ed8; --ling-bg:   #dbeafe;
    --geo:    #059669; --geo-bg:    #d1fae5;
    --social: #d97706; --social-bg: #fef3c7;
    --cogn:   #be185d; --cogn-bg:   #fce7f3;
  }

  /* ── Family colour palette for node backgrounds ── */
  .fc-bantoid   { background: #818cf8 !important; }
  .fc-bantu     { background: #22d3ee !important; }
  .fc-ubangian  { background: #f97316 !important; }
  .fc-adamawa   { background: #84cc16 !important; }
  .fc-chadic    { background: #facc15 !important; }
  .fc-nilosaharan{ background: #e879f9 !important; }
  .fc-atlantic  { background: #fb7185 !important; }
  .fc-other     { background: #94a3b8 !important; }

  #cy { width: 100%; height: 100%; }

  .plane-btn { transition: all .15s; }
  .plane-btn.active { box-shadow: inset 0 0 0 2px currentColor; }

  #detail-panel {
    transition: transform .25s ease;
    transform: translateX(110%);
  }
  #detail-panel.open {
    transform: translateX(0);
  }

  /* slim scrollbar */
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: #f1f5f9; }
  ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 4px; }

  .tag {
    display: inline-block; border-radius: 4px;
    font-size: 11px; font-weight: 600;
    padding: 1px 7px; margin: 2px 2px;
  }
</style>
</head>
<body class="bg-slate-50 text-slate-800 overflow-hidden" style="height:100vh; display:flex; flex-direction:column;">

<!-- ══ NAV BAR ══════════════════════════════════════════════════════════════ -->
<nav class="bg-white border-b border-slate-200 px-4 py-2 flex items-center gap-4 z-10 flex-shrink-0">
  <a href="#/" class="flex items-center gap-2 font-black text-indigo-700 text-lg no-underline">
    <span class="bg-indigo-700 text-white rounded px-1.5 py-0.5 text-sm">L</span>
    <span>Likalo</span>
  </a>
  <span class="text-slate-300">|</span>
  <span class="font-semibold text-slate-700">CamRhizome</span>
  <span class="ml-auto text-xs text-slate-400 hidden sm:block">
    Réseau multiplex inter-communautaire · Données CERDOTOLA/UNESCO
  </span>
</nav>

<!-- ══ MAIN LAYOUT ══════════════════════════════════════════════════════════ -->
<div class="flex flex-1 overflow-hidden relative">

  <!-- ── LEFT SIDEBAR ──────────────────────────────────────────────────────── -->
  <aside id="sidebar" class="w-64 bg-white border-r border-slate-200 flex flex-col overflow-hidden flex-shrink-0">

    <!-- Search -->
    <div class="p-3 border-b border-slate-100">
      <input id="search" type="text" placeholder="Chercher une communauté…"
        class="w-full text-sm border border-slate-200 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-400"/>
    </div>

    <!-- Plane filters -->
    <div class="p-3 border-b border-slate-100">
      <div class="text-xs font-bold uppercase tracking-wide text-slate-400 mb-2">Plans d'analyse</div>
      <div class="flex flex-wrap gap-1">
        <button data-plane="hist"   class="plane-btn active tag" style="background:var(--hist-bg);color:var(--hist)">Historique</button>
        <button data-plane="ling"   class="plane-btn active tag" style="background:var(--ling-bg);color:var(--ling)">Linguistique</button>
        <button data-plane="geo"    class="plane-btn active tag" style="background:var(--geo-bg);color:var(--geo)">Géographique</button>
        <button data-plane="social" class="plane-btn active tag" style="background:var(--social-bg);color:var(--social)">Social</button>
        <button data-plane="cogn"   class="plane-btn active tag" style="background:var(--cogn-bg);color:var(--cogn)">Cognitif</button>
      </div>
    </div>

    <!-- Weight threshold -->
    <div class="p-3 border-b border-slate-100">
      <div class="flex justify-between text-xs text-slate-500 mb-1">
        <span class="font-bold uppercase tracking-wide text-slate-400">Poids min.</span>
        <span id="weight-val" class="font-semibold text-indigo-600">0.10</span>
      </div>
      <input id="weight-slider" type="range" min="0" max="90" value="10" step="5"
        class="w-full accent-indigo-600"/>
    </div>

    <!-- Layout selector -->
    <div class="p-3 border-b border-slate-100">
      <div class="text-xs font-bold uppercase tracking-wide text-slate-400 mb-2">Disposition</div>
      <div class="flex gap-1">
        <button data-layout="cose"   class="layout-btn active text-xs px-2 py-1 rounded bg-indigo-100 text-indigo-700 font-semibold">Force</button>
        <button data-layout="circle" class="layout-btn text-xs px-2 py-1 rounded bg-slate-100 text-slate-600 font-semibold">Cercle</button>
        <button data-layout="grid"   class="layout-btn text-xs px-2 py-1 rounded bg-slate-100 text-slate-600 font-semibold">Grille</button>
      </div>
    </div>

    <!-- Community list -->
    <div class="flex-1 overflow-y-auto">
      <div class="text-xs font-bold uppercase tracking-wide text-slate-400 px-3 pt-3 pb-1">
        Communautés <span id="node-count" class="text-indigo-500"></span>
      </div>
      <div id="community-list" class="pb-2"></div>
    </div>

    <!-- Legend -->
    <div class="p-3 border-t border-slate-100 bg-slate-50">
      <div class="text-xs font-bold uppercase tracking-wide text-slate-400 mb-2">Familles linguistiques</div>
      <div id="legend" class="space-y-1"></div>
    </div>
  </aside>

  <!-- ── GRAPH CANVAS ───────────────────────────────────────────────────────── -->
  <div class="flex-1 relative overflow-hidden">
    <div id="cy" class="w-full h-full"></div>

    <!-- Loading overlay -->
    <div id="loading" class="absolute inset-0 flex items-center justify-center bg-slate-50">
      <div class="text-center">
        <div class="w-12 h-12 border-4 border-indigo-200 border-t-indigo-600 rounded-full animate-spin mx-auto mb-3"></div>
        <div class="text-slate-500 text-sm">Tissage du rhizome…</div>
      </div>
    </div>

    <!-- Top-right stats bar -->
    <div id="stats-bar" class="hidden absolute top-3 right-3 bg-white/90 backdrop-blur rounded-xl shadow text-xs px-4 py-2 text-slate-600 space-x-4">
      <span>Nœuds : <strong id="stat-nodes" class="text-indigo-600"></strong></span>
      <span>Arêtes visibles : <strong id="stat-edges" class="text-indigo-600"></strong></span>
    </div>

    <!-- Reset / fit button -->
    <button id="btn-fit" class="hidden absolute bottom-4 right-4 bg-white shadow rounded-lg px-3 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-50 border border-slate-200">
      ⊞ Ajuster la vue
    </button>
  </div>

  <!-- ── DETAIL PANEL (slides in from right) ───────────────────────────────── -->
  <div id="detail-panel"
    class="absolute top-0 right-0 h-full w-80 bg-white border-l border-slate-200 shadow-2xl overflow-y-auto z-20 flex flex-col">
    <div class="flex items-start justify-between p-4 border-b border-slate-100">
      <div>
        <div id="dp-title" class="font-black text-lg text-indigo-700"></div>
        <div id="dp-emic"  class="text-xs text-slate-400 mt-0.5"></div>
      </div>
      <button id="dp-close" class="text-slate-300 hover:text-slate-600 text-xl leading-none mt-0.5">✕</button>
    </div>
    <div id="dp-body" class="p-4 space-y-4 flex-1 text-sm"></div>
  </div>

</div>

<script>
// ── Colour helpers ──────────────────────────────────────────────────────────
const PLANE_COLOR = {
  hist:   '#7c3aed',
  ling:   '#1d4ed8',
  geo:    '#059669',
  social: '#d97706',
  cogn:   '#be185d',
};
const PLANE_LABEL = {
  hist:'Historique', ling:'Linguistique',
  geo:'Géographique', social:'Social', cogn:'Cognitif',
};
const FC_COLOR = {
  bantoid:    '#818cf8',
  bantu:      '#22d3ee',
  ubangian:   '#f97316',
  adamawa:    '#84cc16',
  chadic:     '#facc15',
  nilosaharan:'#e879f9',
  atlantic:   '#fb7185',
  other:      '#94a3b8',
};
const FC_LABEL = {
  bantoid:    'Bantoid (Grassfields)',
  bantu:      'Bantou',
  ubangian:   'Ubangien',
  adamawa:    'Adamawa (Mbum)',
  chadic:     'Tchadique',
  nilosaharan:'Nilo-Saharien',
  atlantic:   'Atlantic-Congo',
  other:      'Autre',
};

// ── State ───────────────────────────────────────────────────────────────────
let cy, graphData;
let activePlanes = new Set(['hist','ling','geo','social','cogn']);
let minWeight = 0.10;
let activeLayout = 'cose';

// ── Inline data (no server required) ────────────────────────────────────────
(function() {
  const data = RHIZOME_DATA;
  graphData = data;
  init(data);
})();

function init(data) {
  // Build community list sidebar
  buildSidebar(data.nodes);
  buildLegend(data.nodes);

  // Build Cytoscape elements
  const elements = buildElements(data);

  cy = cytoscape({
    container: document.getElementById('cy'),
    elements,
    style: cyStyles(),
    layout: layoutConfig(),
    wheelSensitivity: 0.3,
    minZoom: 0.1,
    maxZoom: 5,
  });

  cy.ready(() => {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('stats-bar').classList.remove('hidden');
    document.getElementById('btn-fit').classList.remove('hidden');
    updateStats();
  });

  cy.on('tap', 'node', e => showDetail(e.target));
  cy.on('tap', e => { if (e.target === cy) closeDetail(); });

  setupControls();
}

// ── Cytoscape elements ───────────────────────────────────────────────────────
function buildElements(data) {
  const nodes = data.nodes.map(n => ({
    data: {
      id:    n.id,
      label: n.label,
      fc:    n.fc || 'other',
      ...n,
    }
  }));

  const edges = data.edges
    .filter(e => activePlanes.has(e.plane) && e.weight >= minWeight)
    .map(e => ({
      data: {
        id:     `${e.source}-${e.type}-${e.target}`,
        source: e.source,
        target: e.target,
        plane:  e.plane,
        weight: e.weight,
        type:   e.type,
        label:  e.label,
      }
    }));

  return [...nodes, ...edges];
}

// ── Cytoscape styles ──────────────────────────────────────────────────────────
function cyStyles() {
  return [
    {
      selector: 'node',
      style: {
        'background-color':   ele => FC_COLOR[ele.data('fc')] || '#94a3b8',
        'label':              'data(label)',
        'color':              '#1e293b',
        'font-size':          '11px',
        'font-weight':        '700',
        'text-valign':        'bottom',
        'text-halign':        'center',
        'text-margin-y':      4,
        'text-outline-color': '#ffffff',
        'text-outline-width': 2,
        'width':              34,
        'height':             34,
        'border-color':       '#ffffff',
        'border-width':       2,
        'shadow-blur':        8,
        'shadow-color':       '#0000001a',
        'shadow-offset-x':    0,
        'shadow-offset-y':    2,
        'transition-property':'background-color, border-color, width, height',
        'transition-duration':'0.15s',
      }
    },
    {
      selector: 'node:selected',
      style: {
        'border-color': '#6366f1',
        'border-width': 3,
        'width': 42, 'height': 42,
      }
    },
    {
      selector: 'node.highlighted',
      style: { 'opacity': 1 }
    },
    {
      selector: 'node.dimmed',
      style: { 'opacity': 0.2 }
    },
    {
      selector: 'edge',
      style: {
        'width':            ele => Math.max(1, ele.data('weight') * 6),
        'line-color':       ele => PLANE_COLOR[ele.data('plane')] || '#94a3b8',
        'opacity':          0.55,
        'curve-style':      'bezier',
        'target-arrow-shape': 'none',
        'transition-property':'opacity, width',
        'transition-duration':'0.15s',
      }
    },
    {
      selector: 'edge.highlighted',
      style: { 'opacity': 0.9 }
    },
    {
      selector: 'edge.dimmed',
      style: { 'opacity': 0.05 }
    },
  ];
}

// ── Layout configs ────────────────────────────────────────────────────────────
function layoutConfig(name) {
  name = name || activeLayout;
  const base = { animate: true, animationDuration: 600 };
  if (name === 'cose') return {
    ...base, name: 'cose',
    idealEdgeLength: 120, nodeOverlap: 20,
    nodeRepulsion: () => 8000,
    edgeElasticity: () => 32,
    gravity: 0.2, numIter: 1000, coolingFactor: 0.95,
  };
  if (name === 'circle') return { ...base, name: 'circle', radius: 280, padding: 40 };
  return { ...base, name: 'grid', padding: 30 };
}

// ── Sidebar community list ────────────────────────────────────────────────────
function buildSidebar(nodes) {
  const el = document.getElementById('community-list');
  document.getElementById('node-count').textContent = `(${nodes.length})`;
  nodes.sort((a,b) => a.label.localeCompare(b.label)).forEach(n => {
    const dot = document.createElement('div');
    dot.className = 'flex items-center gap-2 px-3 py-1.5 hover:bg-slate-50 cursor-pointer text-sm';
    dot.dataset.id = n.id;
    dot.innerHTML = `
      <span class="w-3 h-3 rounded-full flex-shrink-0" style="background:${FC_COLOR[n.fc]||'#94a3b8'}"></span>
      <span class="truncate">${n.label}</span>
      <span class="ml-auto text-xs text-slate-400 flex-shrink-0">${n.region.split(' / ')[0]}</span>
    `;
    dot.addEventListener('click', () => {
      if (!cy) return;
      const node = cy.getElementById(n.id);
      if (node.length) {
        cy.animate({ fit: { eles: node.closedNeighborhood(), padding: 80 }, duration: 500 });
        showDetail(node);
      }
    });
    el.appendChild(dot);
  });
}

// ── Legend ───────────────────────────────────────────────────────────────────
function buildLegend(nodes) {
  const fcs = [...new Set(nodes.map(n => n.fc))];
  const el = document.getElementById('legend');
  fcs.forEach(fc => {
    const row = document.createElement('div');
    row.className = 'flex items-center gap-2 text-xs text-slate-600';
    row.innerHTML = `
      <span class="w-3 h-3 rounded-sm flex-shrink-0" style="background:${FC_COLOR[fc]}"></span>
      <span>${FC_LABEL[fc] || fc}</span>
    `;
    el.appendChild(row);
  });
}

// ── Detail panel ──────────────────────────────────────────────────────────────
function showDetail(node) {
  const d = node.data();
  document.getElementById('dp-title').textContent = d.label;
  document.getElementById('dp-emic').textContent = d.emicName ? `« ${d.emicName} »` : '';

  const body = document.getElementById('dp-body');
  body.innerHTML = '';

  // Meaning
  if (d.meaning) {
    body.innerHTML += section('Signification du nom', `<em>${d.meaning}</em>`);
  }

  // Essentials
  body.innerHTML += section('Profil', `
    <div class="space-y-1">
      <div><span class="text-slate-400">Région :</span> <strong>${d.region||'—'}</strong></div>
      <div><span class="text-slate-400">Famille :</span> <strong>${d.family||'—'}</strong></div>
      <div><span class="text-slate-400">Système numéral :</span> <strong>${d.numeralSystem||'—'}</strong></div>
      ${d.origins && d.origins.length ? `<div><span class="text-slate-400">Origine(s) :</span> <strong>${d.origins.join(', ')}</strong></div>` : ''}
    </div>
  `);

  // Connected communities
  const connEdges = node.connectedEdges();
  const connNodes = connEdges.connectedNodes().not(node);
  if (connNodes.length) {
    const byPlane = {};
    connEdges.forEach(e => {
      const p = e.data('plane');
      const other = e.source().id() === d.id ? e.target() : e.source();
      if (!byPlane[p]) byPlane[p] = [];
      byPlane[p].push({ label: other.data('label'), w: e.data('weight') });
    });
    let html = '';
    Object.keys(byPlane).sort().forEach(p => {
      const items = byPlane[p].sort((a,b) => b.w - a.w);
      const tags = items.map(x =>
        `<span class="tag" style="background:${PLANE_COLOR[p]}22;color:${PLANE_COLOR[p]}">${x.label}</span>`
      ).join('');
      html += `<div class="mb-2"><div class="text-xs font-bold text-slate-400 mb-1">${PLANE_LABEL[p]}</div>${tags}</div>`;
    });
    body.innerHTML += section(`Connexions (${connNodes.length})`, html);
  }

  // QA excerpts
  if (d.qa) {
    const items = [
      ['Voisins déclarés', d.qa.neighbors],
      ['Origine / migration', d.qa.origin],
      ['Relations sociales', d.qa.social],
    ].filter(([,v]) => v && v.trim());
    if (items.length) {
      const html = items.map(([title, text]) =>
        `<div class="mb-2"><div class="text-xs font-bold text-slate-400">${title}</div>
         <div class="text-xs text-slate-600 mt-0.5 leading-relaxed">${text.slice(0,300)}${text.length>300?'…':''}</div></div>`
      ).join('');
      body.innerHTML += section('Données du questionnaire', html);
    }
  }

  // Highlight neighbourhood
  cy.elements().addClass('dimmed');
  node.removeClass('dimmed').addClass('highlighted');
  node.closedNeighborhood().removeClass('dimmed').addClass('highlighted');

  document.getElementById('detail-panel').classList.add('open');
}

function section(title, content) {
  return `<div>
    <div class="text-xs font-bold uppercase tracking-wide text-slate-400 mb-1.5">${title}</div>
    <div class="text-sm leading-relaxed">${content}</div>
  </div>`;
}

function closeDetail() {
  document.getElementById('detail-panel').classList.remove('open');
  if (cy) {
    cy.elements().removeClass('dimmed highlighted');
  }
}

document.getElementById('dp-close').addEventListener('click', closeDetail);

// ── Controls ──────────────────────────────────────────────────────────────────
function setupControls() {

  // Plane filter buttons
  document.querySelectorAll('.plane-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const plane = btn.dataset.plane;
      if (activePlanes.has(plane)) {
        activePlanes.delete(plane);
        btn.classList.remove('active');
      } else {
        activePlanes.add(plane);
        btn.classList.add('active');
      }
      rebuildEdges();
    });
  });

  // Weight slider
  const slider = document.getElementById('weight-slider');
  const weightVal = document.getElementById('weight-val');
  slider.addEventListener('input', () => {
    minWeight = parseInt(slider.value) / 100;
    weightVal.textContent = minWeight.toFixed(2);
    rebuildEdges();
  });

  // Layout buttons
  document.querySelectorAll('.layout-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.layout-btn').forEach(b => {
        b.className = b.className.replace('bg-indigo-100 text-indigo-700', 'bg-slate-100 text-slate-600');
      });
      btn.className = btn.className.replace('bg-slate-100 text-slate-600', 'bg-indigo-100 text-indigo-700');
      activeLayout = btn.dataset.layout;
      cy.layout(layoutConfig()).run();
    });
  });

  // Fit button
  document.getElementById('btn-fit').addEventListener('click', () => {
    cy.fit(cy.elements(':visible'), 40);
  });

  // Search
  const search = document.getElementById('search');
  search.addEventListener('input', () => {
    const q = search.value.toLowerCase().trim();
    document.querySelectorAll('#community-list > div').forEach(el => {
      const matches = !q || el.textContent.toLowerCase().includes(q);
      el.style.display = matches ? '' : 'none';
    });
    if (q.length >= 2 && cy) {
      cy.nodes().forEach(n => {
        if (n.data('label').toLowerCase().includes(q)) {
          n.removeClass('dimmed').addClass('highlighted');
        } else {
          n.removeClass('highlighted').addClass('dimmed');
        }
      });
    } else if (!q && cy) {
      cy.elements().removeClass('dimmed highlighted');
    }
  });
}

// ── Rebuild edge visibility ───────────────────────────────────────────────────
function rebuildEdges() {
  if (!cy || !graphData) return;
  // Remove all edges and re-add filtered set
  cy.edges().remove();
  const filtered = graphData.edges
    .filter(e => activePlanes.has(e.plane) && e.weight >= minWeight)
    .map(e => ({
      data: {
        id:     `${e.source}-${e.type}-${e.target}`,
        source: e.source,
        target: e.target,
        plane:  e.plane,
        weight: e.weight,
        type:   e.type,
        label:  e.label,
      }
    }));
  cy.add(filtered);
  cy.style(cyStyles()); // re-apply styles to new elements
  updateStats();
}

function updateStats() {
  if (!cy) return;
  document.getElementById('stat-nodes').textContent = cy.nodes().length;
  document.getElementById('stat-edges').textContent = cy.edges().length;
}
